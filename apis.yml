aid: akston-biosciences
name: Akston Biosciences
description: 'Akston Biosciences Corporation is a privately held biotechnology company
  headquartered in Beverly, Massachusetts, founded in 2011 by the team from SmartCells,
  Inc. and led by CEO Todd Zion, Ph.D. Akston designs, develops and manufactures protein
  therapeutics built on its proprietary Ambifect Fc-fusion protein platform, with a
  pipeline focused on companion-animal (veterinary) medicine: PD-L1 monoclonal antibody
  oncology candidates (AKS-701d, AKS-619d), a long-acting GLP-1 for feline weight management
  (AKS-562c), an IL-31 targeting therapy for canine pruritus (AKS-699), and NGF-targeting
  candidates for osteoarthritis pain. Its veterinary insulin program was sold to Dechra
  in 2024, and human programs continue through the Vakston and Diamune Therapeutics
  subsidiaries. The company announced a manufacturing expansion in Shreveport, Louisiana.
  Akston is a therapeutics developer and manufacturer, not a software vendor: it publishes
  a corporate marketing site and no public API, SDK, developer portal or machine-readable
  specification.'
